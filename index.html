<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almanax Dofus 3</title>
<meta name="description" content="Bonus de l'Almanax Dofus 3 au jour le jour, offrandes à préparer et recherche par catégorie.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%85%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="site-header">
    <h1 class="wordmark"><a href="./">Almanax</a></h1>
    <p class="muted" id="coverage">Dofus 3</p>
  </header>

  <p id="stale" class="banner" hidden></p>

  <div class="layout">
    <main class="main">
      <section id="day-view" aria-live="polite">
        <div class="card"><p class="muted">Chargement de l'Almanax…</p></div>
      </section>

      <section id="search-view" hidden aria-labelledby="search-title">
        <div class="search-head">
          <button type="button" id="search-back" class="icon-btn" aria-label="Retour au calendrier">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <h2 id="search-title">Recherche avancée</h2>
        </div>

        <div class="field">
          <label for="q">Offrande ou mot-clé</label>
          <input id="q" type="search" placeholder="ex : Crinière fleurie, herboricoles" autocomplete="off">
        </div>

        <fieldset class="field">
          <legend>Catégories</legend>
          <div id="chips" class="chips"></div>
        </fieldset>

        <div id="hints"></div>

        <div class="field field-inline">
          <label for="period">Période</label>
          <select id="period">
            <option value="30">30 prochains jours</option>
            <option value="90">3 prochains mois</option>
            <option value="all">Tout</option>
          </select>
        </div>

        <p id="count" class="muted" aria-live="polite"></p>
        <ol id="results" class="results"></ol>
      </section>
    </main>

    <aside class="aside">
      <section class="card calendar" aria-labelledby="cal-title">
        <div class="cal-head">
          <button type="button" id="cal-prev" class="icon-btn" aria-label="Mois précédent">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <h2 id="cal-title" class="cal-title"></h2>
          <button type="button" id="cal-next" class="icon-btn" aria-label="Mois suivant">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        <div class="cal-weekdays" aria-hidden="true">
          <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
        </div>
        <div id="cal-grid" class="cal-grid"></div>
      </section>

      <button type="button" id="search-toggle" class="btn-outline" aria-controls="search-view" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>Recherche avancée</span>
      </button>

      <ul id="legend" class="legend" aria-label="Légende des catégories"></ul>
    </aside>
  </div>

  <footer class="site-footer muted">
    <p>Données issues de l'API communautaire dofusdude, sans lien avec Ankama. Mises à jour chaque nuit.</p>
    <p id="generated"></p>
  </footer>
</div>
<script src="app.js" defer></script>
</body>
</html>
